<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BMUX</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <span class="mark">BMUX</span>
        <span class="tab" id="tab-label">this tab</span>
    </header>

    <button id="toggle" class="action primary">
        <span class="action-label">Toggle</span>
        <span class="action-hint" id="toggle-hint">show or hide the overlay</span>
    </button>

    <button id="settings" class="action">
        <span class="action-label">Settings</span>
        <span class="action-hint">edit the toolbar buttons</span>
    </button>

    <footer>
        <span id="status">Ready</span>
        <span id="version" class="version"></span>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
